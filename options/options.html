<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Impostazioni Maps</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="title">
        <p class="eyebrow">Estensione Chrome / Edge</p>
        <h1 id="title">Cerca indirizzi su Google Maps</h1>

        <form id="settings-form" class="settings">
          <label class="setting">
            <input type="checkbox" name="contextSearchEnabled">
            <span>
              <strong>Ricerca da testo selezionato</strong>
              <small>Aggiunge al menu contestuale "Cerca su Google Maps".</small>
            </span>
          </label>

          <label class="setting">
            <input type="checkbox" name="contextDirectionsEnabled">
            <span>
              <strong>Indicazioni da testo selezionato</strong>
              <small>Aggiunge al menu contestuale "Indicazioni con Google Maps".</small>
            </span>
          </label>

          <section class="setting setting-group" aria-labelledby="button-title">
            <label class="setting-main">
              <input type="checkbox" name="searchEngineButtonEnabled">
              <span>
                <strong id="button-title">Pulsante Maps/GMaps nei motori di ricerca</strong>
                <small>Mostra un pulsante per cercare la query corrente su Google Maps.</small>
              </span>
            </label>

            <fieldset class="scope-options" aria-label="Dove mostrare il pulsante Maps/GMaps">
              <label>
                <input type="radio" name="searchEngineButtonScope" value="both">
                <span>Google e Bing</span>
              </label>
              <label>
                <input type="radio" name="searchEngineButtonScope" value="google">
                <span>Solo Google</span>
              </label>
              <label>
                <input type="radio" name="searchEngineButtonScope" value="bing">
                <span>Solo Bing</span>
              </label>
            </fieldset>
          </section>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <footer class="footer">
          <p>MIT License. Compatibile con Chrome e Edge.</p>
          <p>
            Copyright 2026 Danilo Carbonaro.
            Fatto con amore &lt;3 a Catania.
            <a href="https://github.com/daniloctdev/browser-button-maps" target="_blank" rel="noopener noreferrer">GitHub</a>
          </p>
        </footer>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
